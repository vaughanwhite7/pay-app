<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Pay</title>
<!-- Pure black (#000000) for the gesture-bar strip and app background on AMOLED, in both day and night mode. -->
<link rel="manifest" href="manifest-black.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#f4f4f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<style>
:root{--page:#f4f4f7;--card:#ffffff;--text:#1b1b1f;--sub:#6e6e76;--accent:#3e91ff;--soft:#e4eeff;--accentText:#1a5fd0}
@media (prefers-color-scheme:dark){:root{--page:#000000;--card:#17171a;--text:#f2f2f5;--sub:#a1a1aa;--soft:#112a4d;--accentText:#9cc3ff}}
html,body{margin:0;height:100%;background:var(--page);color:var(--text);font-family:"SamsungOne","Roboto",system-ui,sans-serif;overflow:hidden}
iframe{position:fixed;top:0;left:0;right:0;bottom:0;width:100%;height:100%;border:0;background:var(--page)}
html{background:var(--page)}
.screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;background:var(--page);z-index:2}
.screen[hidden]{display:none}
.logo{width:84px;height:84px;border-radius:26px;margin-bottom:18px}
h1{font-size:30px;margin:0 0 8px}
p{color:var(--sub);font-size:14px;line-height:1.45;max-width:340px;margin:0 0 18px}
input{width:100%;max-width:360px;box-sizing:border-box;border:0;border-radius:18px;padding:15px 16px;font-size:15px;background:var(--card);color:var(--text);margin-bottom:12px;font-family:inherit}
button{width:100%;max-width:360px;border:0;border-radius:999px;padding:15px;font-size:16px;font-weight:600;font-family:inherit;margin-bottom:10px;background:var(--accent);color:#fff}
button.alt{background:var(--soft);color:var(--accentText)}
.spin{width:34px;height:34px;border-radius:50%;border:4px solid var(--soft);border-top-color:var(--accent);animation:s 1s linear infinite;margin-top:6px}
@keyframes s{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<!-- First run: paste your Apps Script web-app URL (ends in /exec). It is stored only on this phone. -->
<div class="screen" id="setup" hidden>
  <img class="logo" src="icon-192.png" alt="">
  <h1>Shift Pay</h1>
  <p>Paste your web app URL from Apps Script (Deploy → Manage deployments). It ends in <b>/exec</b> and is only saved on this phone.</p>
  <input id="url" type="url" inputmode="url" placeholder="https://script.google.com/macros/s/…/exec" autocomplete="off">
  <button id="save">Open my pay app</button>
</div>
<!-- Shown while loading, and if Google needs you to sign in first. -->
<div class="screen" id="wait">
  <img class="logo" src="icon-192.png" alt="">
  <div class="spin" id="spin"></div>
  <div id="help" hidden>
    <p style="margin-top:18px">Still loading… If this is the first time, Google may need you to sign in. Sign in, then come back to this app and tap Retry.</p>
    <button id="signin">Sign in to Google</button>
    <button class="alt" id="retry">Retry</button>
    <button class="alt" id="change">Change web app URL</button>
  </div>
</div>
<iframe id="app" title="Pay" allow="clipboard-write"></iframe>
<script>
var KEY='payAppUrl', frame=document.getElementById('app'), wait=document.getElementById('wait'), setup=document.getElementById('setup'), timer;
function get(){try{return localStorage.getItem(KEY)||'';}catch(e){return '';}}
function set(v){try{localStorage.setItem(KEY,v);}catch(e){}}
function valid(u){return /^https:\/\/script\.google\.com\/(a\/[^/]+\/)?macros\/s\/[^/]+\/exec/.test(u);}
function showSetup(){setup.hidden=false;wait.hidden=true;document.getElementById('url').value=get();}
function start(){
  var u=get(); if(!valid(u)||/[?&]setup\b/.test(location.search)){showSetup();return;}
  setup.hidden=true; wait.hidden=false; document.getElementById('help').hidden=true; document.getElementById('spin').hidden=false;
  frame.src=u;
  clearTimeout(timer); timer=setTimeout(function(){document.getElementById('help').hidden=false;document.getElementById('spin').hidden=true;},12000);
}
window.addEventListener('message',function(e){
  if(e.data&&e.data.payApp==='ready'&&/(\.googleusercontent\.com|script\.google\.com)$/.test(new URL(e.origin).hostname)){clearTimeout(timer);wait.hidden=true;}
});
document.getElementById('save').onclick=function(){
  var u=document.getElementById('url').value.trim();
  if(!valid(u)){alert('That doesn’t look like an Apps Script web app URL. It should start with https://script.google.com/macros/s/ and end in /exec.');return;}
  set(u); history.replaceState(null,'',location.pathname); start();
};
document.getElementById('signin').onclick=function(){window.open(get(),'_blank');};
document.getElementById('retry').onclick=start;
document.getElementById('change').onclick=showSetup;
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function(){});
start();
</script>
</body>
</html>
